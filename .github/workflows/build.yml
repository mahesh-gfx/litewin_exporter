name: build

on:
  push:
    branches: [main, dev, testing]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make -f Makefile.test unit

  # build both target architectures
  build:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Build (both architectures, -Werror)
        run: make
      - name: Upload built exes
        uses: actions/upload-artifact@v4
        with:
          name: exes
          path: dist/*.exe

  # integration smoke test using Wine
  smoke:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: exes
          path: dist
      - name: Install Wine
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64
      - name: Smoke test (HTTP server)
        run: bash tests/smoke.sh dist/litewin_exporter_amd64.exe 9183
