# Release: build the exes, (optionally) code-sign them, and publish a zipped
# bundle to the GitHub Release. Runs on tag push only (build.yml handles every
# push/PR).
#
# Signing is stubbed until SignPath is configured (TASK-9): the sign step is
# skipped unless the SIGNPATH_ORGANIZATION_ID repo variable is set, so tagging
# produces a working (unsigned) release today and a signed one once TASK-9 lands.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686

      - name: Build (both architectures, -Werror)
        run: make

      # --- optional signing (no-op until TASK-9 sets SIGNPATH_ORGANIZATION_ID) ---
      - name: Upload unsigned exes
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exes
          path: dist/*.exe

      - name: Sign with SignPath
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: litewin_exporter
          signing-policy-slug: release-signing
          artifact-configuration-slug: exes
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # --- assemble the release bundle -----------------------------------------
      - name: Assemble bundle (exes + installers + README + SHA256SUMS)
        run: |
          set -e
          # Use signed exes if signing ran, otherwise the freshly built ones.
          SRC=dist
          [ -d signed ] && SRC=signed
          BUNDLE="litewin_exporter-${GITHUB_REF_NAME}"
          mkdir -p "$BUNDLE"
          cp "$SRC"/litewin_exporter_amd64.exe "$SRC"/litewin_exporter_386.exe "$BUNDLE"/
          cp packaging/install.bat packaging/uninstall.bat packaging/install-litewin.ps1 "$BUNDLE"/
          cp README.md "$BUNDLE"/
          ( cd "$BUNDLE" && sha256sum *.exe > SHA256SUMS )
          # A copy of the checksums outside the zip, for a quick pre-download check.
          cp "$BUNDLE"/SHA256SUMS SHA256SUMS
          zip -r "${BUNDLE}.zip" "$BUNDLE"
          ls -l "${BUNDLE}.zip" SHA256SUMS

      - name: Publish bundle to the Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            litewin_exporter-${{ github.ref_name }}.zip
            SHA256SUMS
